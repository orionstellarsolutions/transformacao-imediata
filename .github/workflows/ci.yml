name: SDD Quality & Mobile Performance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linting
        run: npm run lint

      - name: Checagem Estática de Tipos
        run: npm run type-check

      - name: Testes Unitários e Cobertura
        run: npm run test:coverage

      - name: Build da Aplicação
        run: npm run build

      - name: Auditoria de Performance Mobile (Lighthouse CI)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
          startServerCommand: npm run preview
          serverReadyPattern: 'Local:'
          serverReadyTimeout: 30000
          uploadTarget: 'temporary-public-storage'
          configPath: './lighthouserc.json'

      - name: Deploy no Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '95d621bdb59aee8175fc109ac9f38330'
          command: pages deploy dist --project-name=transformacao-imediata --branch=main
