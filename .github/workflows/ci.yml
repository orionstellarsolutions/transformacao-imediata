name: SDD Quality & Mobile Performance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-performance:
    name: 🛡️ Gate de Qualidade & Performance Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linting
        run: npm run lint

      - name: Checagem Estática de Tipos (TypeScript / vue-tsc)
        run: npm run type-check

      - name: Testes Unitários e Cobertura (Vitest)
        run: npm run test:coverage

      - name: Build da Aplicação
        run: npm run build

      - name: Iniciar Servidor Preview Local
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/?ci=1" | grep -q "200"; then
              echo "Preview server pronto na porta 3000!"
              break
            fi
            echo "Aguardando preview server..."
            sleep 1
          done

      - name: Auditoria de Performance Mobile (Lighthouse CI)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/?ci=1
          configPath: './lighthouserc.json'
          temporaryPublicStorage: true

      - name: Salvar Artefato Compilado (dist)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 1

  deploy-production:
    name: 🚀 Deploy Cloudflare Pages
    needs: quality-and-performance
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Baixar Artefato Compilado (dist)
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist/

      - name: Publicar no Cloudflare Pages (Wrangler Nativo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '95d621bdb59aee8175fc109ac9f38330'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Secret Ausente::O secret CLOUDFLARE_API_TOKEN não está definido no repositório GitHub."
            echo "Para habilitar o deploy automático via GitHub Actions:"
            echo "1. Acesse https://dash.cloudflare.com/profile/api-tokens"
            echo "2. Crie um token com permissão Cloudflare Pages (Read + Write)"
            echo "3. No repositório GitHub, acesse Settings -> Secrets and variables -> Actions"
            echo "4. Adicione o secret CLOUDFLARE_API_TOKEN com o token gerado"
            echo "Nota: Caso utilize a integração Git nativa do Cloudflare Pages, os deploys já ocorrem no push."
            exit 1
          fi

          echo "Iniciando publicação com Wrangler v4..."
          npx wrangler pages deploy dist --project-name=transformacao-imediata --branch=main --commit-dirty=true